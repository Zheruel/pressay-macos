[package]
name = "pressay-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
aws-lc-rs = "1"
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures-util = "0.3"
jsonwebtoken = { version = "11.1", features = ["aws_lc_rs"] }
getrandom = "0.4"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "json", "form"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "rt-multi-thread", "macros", "fs", "net"] }
tokio-util = "0.7"
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
unicode-normalization = "0.1"
whatlang = "0.18"
zeroize = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
