name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    name: Build and publish DMG
    runs-on: macos-26
    timeout-minutes: 120
    env:
      # Keep stable self-signed releases available until Apple credentials exist.
      PRESSAY_NOTARIZE: ${{ vars.PRESSAY_NOTARIZE || '0' }}
      PRESSAY_NOTARY_PROFILE: pressay-release

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Verify release configuration and version
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
        run: |
          if [[ -z "$SPARKLE_PRIVATE_KEY" ]]; then
            echo 'Configure SPARKLE_PRIVATE_KEY before publishing an updatable release.' >&2
            exit 1
          fi
          if [[ "$PRESSAY_NOTARIZE" != 0 && "$PRESSAY_NOTARIZE" != 1 ]]; then
            echo 'Repository variable PRESSAY_NOTARIZE must be 0 or 1.' >&2
            exit 1
          fi
          if [[ "$PRESSAY_NOTARIZE" == 1 && ( -z "$APPLE_NOTARY_KEY" || -z "$APPLE_NOTARY_KEY_ID" || -z "$APPLE_NOTARY_ISSUER" ) ]]; then
            echo 'Configure the Apple notarization secrets described in docs/releases.md before publishing.' >&2
            exit 1
          fi
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Config/Info.plist)"
          if [[ "${GITHUB_REF_NAME}" != "v${VERSION}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Info.plist version ${VERSION}" >&2
            exit 1
          fi

      - name: Run tests
        run: xcrun swift test --disable-sandbox

      # Keep signing identity stable; switching to Developer ID may need reapproval.
      - name: Import release signing certificate
        env:
          RELEASE_SIGNING_CERTIFICATE: ${{ secrets.RELEASE_SIGNING_CERTIFICATE }}
          RELEASE_SIGNING_PASSWORD: ${{ secrets.RELEASE_SIGNING_PASSWORD }}
        run: |
          if [[ -z "$RELEASE_SIGNING_CERTIFICATE" || -z "$RELEASE_SIGNING_PASSWORD" ]]; then
            echo 'Configure the release certificate secrets described in docs/releases.md.' >&2
            exit 1
          fi
          umask 077
          KEYCHAIN="$RUNNER_TEMP/release-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          IDENTITY_FILE="$RUNNER_TEMP/release-signing.p12"
          trap 'rm -f "$IDENTITY_FILE"' EXIT
          printf '%s' "$RELEASE_SIGNING_CERTIFICATE" | base64 --decode > "$IDENTITY_FILE"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "RELEASE_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "PRESSAY_NOTARY_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          security set-keychain-settings -lut 7200 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$IDENTITY_FILE" -k "$KEYCHAIN" -P "$RELEASE_SIGNING_PASSWORD" -T /usr/bin/codesign >/dev/null
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          IFS=$'\n' read -r -d '' -a EXISTING < <(security list-keychains -d user | sed 's/^ *"//; s/"$//') || true
          security list-keychains -d user -s "$KEYCHAIN" "${EXISTING[@]}"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -n 1)"
          if [[ -z "$IDENTITY" && "$PRESSAY_NOTARIZE" != 1 ]]; then
            # Self-signed roots are not included by find-identity -v. Keep using
            # the certificate hash, preserving the established release identity.
            IDENTITY="$(security find-identity -p codesigning "$KEYCHAIN" | awk '/"Pressay Release Signing"/ { print $2; exit }')"
          fi
          [[ -n "$IDENTITY" ]] || { echo 'Release identity is missing; notarization requires Developer ID Application.' >&2; exit 1; }
          echo "SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Store notarization credentials in the temporary keychain
        if: env.PRESSAY_NOTARIZE == '1'
        env:
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
        run: |
          umask 077
          NOTARY_KEY_FILE="$RUNNER_TEMP/notary-key.p8"
          trap 'rm -f "$NOTARY_KEY_FILE"' EXIT
          printf '%s' "$APPLE_NOTARY_KEY" > "$NOTARY_KEY_FILE"
          xcrun notarytool store-credentials "$PRESSAY_NOTARY_PROFILE" \
            --key "$NOTARY_KEY_FILE" --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER" --keychain "$RELEASE_KEYCHAIN" >/dev/null

      - name: Package and verify app and DMG (notarize when configured)
        run: |
          if ! xcrun metal --version >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          ./scripts/package-dmg.sh

      - name: Sign update and generate feed
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          SPARKLE_VERSION='2.10.1'
          SPARKLE_ARCHIVE="$RUNNER_TEMP/Sparkle.tar.xz"
          curl --fail --location --silent --show-error \
            "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz" \
            --output "$SPARKLE_ARCHIVE"
          echo "1a856d2a9edb8e628de88121d7be04cf0e2167f8641650b78fca00b14244cf27  $SPARKLE_ARCHIVE" | shasum -a 256 --check
          mkdir "$RUNNER_TEMP/sparkle"
          tar -xJf "$SPARKLE_ARCHIVE" -C "$RUNNER_TEMP/sparkle"
          umask 077
          export SPARKLE_KEY_FILE="$RUNNER_TEMP/sparkle-private-key"
          trap 'rm -f "$SPARKLE_KEY_FILE"' EXIT
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$SPARKLE_KEY_FILE"
          export SPARKLE_TOOLS_DIR="$RUNNER_TEMP/sparkle/bin"
          ./scripts/package-update.sh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=()
          if [[ "$PRESSAY_NOTARIZE" != 1 ]]; then
            NOTES=(--notes 'This build is not Apple-notarized. Browser downloads may require System Settings → Privacy & Security → Open Anyway on first launch.')
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --title "Pressay ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            "${NOTES[@]}" \
            .build/Pressay-*.dmg \
            .build/updates/Pressay-macos-arm64.zip \
            .build/updates/SHA256SUMS \
            .build/updates/appcast.xml

      - name: Remove release signing keychain
        if: always()
        run: |
          if [[ -n "${RELEASE_KEYCHAIN:-}" ]]; then
            security delete-keychain "$RELEASE_KEYCHAIN" || true
          fi
