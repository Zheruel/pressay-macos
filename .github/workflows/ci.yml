name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust core and desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libxkbcommon-dev libdbus-1-dev dbus-daemon xvfb xauth pulseaudio-utils
      - name: Rust formatting
        run: cargo fmt --all --check
      - name: Core, native worker, and audio regression tests
        run: cargo test --workspace --locked
      - name: Native X11 insertion and clipboard preservation
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo test -p pressay-desktop --locked x11_insertion -- --ignored
      - name: Rust diagnostics
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
