name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac-runtime:
    name: Mac speech runtime and app scripts
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Show toolchain
        id: toolchain
        run: |
          sw_vers
          xcodebuild -version
          echo "xcode=$(xcodebuild -version | shasum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      # Key compiled dependencies by toolchain to avoid mixing compiler versions.
      - name: Restore build cache
        uses: actions/cache@v6
        with:
          path: Runtime/.build
          key: runtime-swiftbuild-${{ runner.os }}-${{ steps.toolchain.outputs.xcode }}-${{ hashFiles('Runtime/Package.resolved') }}
          restore-keys: |
            runtime-swiftbuild-${{ runner.os }}-${{ steps.toolchain.outputs.xcode }}-

      # The app bundles this Swift/MLX worker for Orukeet and Mega-ASR on Mac.
      - name: Build the Swift speech worker
        run: |
          if ! xcrun metal --version >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun swift build --package-path Runtime --build-system swiftbuild --disable-sandbox -c release

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Check the app's web UI formatting and packaging scripts
        run: |
          npm ci --prefix apps/desktop
          npx --yes prettier@3.9.10 --check "apps/desktop/ui/**/*.{js,css,html}"
          python3 -m py_compile scripts/*.py

  rust:
    name: Rust core and desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libxkbcommon-dev libdbus-1-dev dbus-daemon xvfb xauth pulseaudio-utils
      - name: Rust formatting
        run: cargo fmt --all --check
      - name: Core, native worker, and audio regression tests
        run: cargo test --workspace --locked
      - name: Native X11 insertion and clipboard preservation
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo test -p pressay-desktop --locked x11_insertion -- --ignored
      - name: Rust diagnostics
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
