name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Swift tests
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Show toolchain
        id: toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          echo "xcode=$(xcodebuild -version | shasum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      # Key compiled dependencies by toolchain to avoid mixing compiler versions.
      - name: Restore build cache
        uses: actions/cache@v6
        with:
          path: |
            .build
            Runtime/.build
          key: spm-swiftbuild-${{ runner.os }}-${{ steps.toolchain.outputs.xcode }}-${{ hashFiles('Package.resolved', 'Runtime/Package.resolved') }}
          restore-keys: |
            spm-swiftbuild-${{ runner.os }}-${{ steps.toolchain.outputs.xcode }}-

      - name: Resolve dependencies
        run: xcrun swift package resolve

      - name: Run tests
        run: xcrun swift test --disable-sandbox

      # Reuse debug objects; the release workflow checks optimized packaging.
      - name: Build and verify app bundle
        env:
          CONFIGURATION: debug
        run: |
          if ! xcrun metal --version >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          ./scripts/build-app.sh
