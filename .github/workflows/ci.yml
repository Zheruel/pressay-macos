name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Swift tests
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Resolve dependencies
        run: xcrun swift package resolve

      - name: Run tests
        run: xcrun swift test --disable-sandbox

      # Builds the release executable, assembles the bundle (Info.plist,
      # embedded framework, assets), ad-hoc signs, and codesign-verifies —
      # catches packaging regressions the plain product build cannot.
      - name: Build and verify app bundle
        run: ./scripts/build-app.sh
