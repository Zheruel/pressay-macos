name: Bug report
description: Report a reproducible Pressay problem without sharing private dictation data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Pressay. Do not attach real prompt history, private audio, API keys, or logs containing confidential text.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Recording or shortcut
        - Transcription
        - Cleanup or vocabulary
        - Prompt polish
        - Cursor insertion
        - Permissions or onboarding
        - Settings or history
        - Build or installation
        - Other
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "26.0"
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Mac model / chip
      placeholder: "MacBook Pro, M5 Pro"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use a synthetic sentence if speech content matters.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Remove transcripts, cursor context, file paths containing names, and secrets.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private audio, transcript text, API keys, and confidential screenshots.
          required: true
        - label: This is not a security vulnerability; if it is, I will use private vulnerability reporting instead.
          required: true
