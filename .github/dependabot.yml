version: 2
updates:
  # Workflow actions, one grouped PR a week.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Only take releases that have been public for a week.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "CI"
    groups:
      actions:
        patterns: ["*"]

  # Runtime/Package.swift: the Mac speech worker's Swift packages.
  - package-ecosystem: swift
    directory: /Runtime
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "Deps"
    groups:
      swift:
        patterns: ["*"]
