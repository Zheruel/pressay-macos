version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Covers Package.swift dependencies. The only current one is the pinned
  # transcribe.cpp binaryTarget, which Dependabot cannot bump — bump its
  # url + checksum manually on new upstream releases.
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
