[package]
name = "pressay-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
pressay-core = { path = "../../../crates/pressay-core" }
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
open = "5"
keyring-core = "1"
tauri-plugin-updater = "2"
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
cpal = "0.18"
rubato = "5"
arboard = { version = "3", default-features = false }
tempfile = "3"
libc = "0.2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1.10"
apple-native-keyring-store = { version = "1", default-features = false, features = ["keychain"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
enigo = "0.6"

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "1"
windows = { version = "0.62", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_RemoteDesktop", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_Graphics_Gdi", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Ole", "Win32_UI_Accessibility", "Win32_Graphics_Dwm"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }
x11rb = "0.14"
zbus = { version = "6", default-features = false, features = ["tokio", "proxy"] }
futures-util = "0.3"

[target.'cfg(target_os = "linux")'.dev-dependencies]
glib = "0.18"
zbus = { version = "6", default-features = false, features = ["tokio", "service"] }
