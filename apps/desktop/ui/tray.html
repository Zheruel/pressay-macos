<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Pressay</title>
    <link rel="stylesheet" href="tray.css" />
  </head>
  <body>
    <main id="tray-panel">
      <header class="status">
        <strong>Pressay</strong>
        <span class="status-hint" id="status-hint" role="status"></span>
      </header>
      <div id="update-notice" class="notice" hidden>
        <span id="update-message"></span
        ><button id="install-update" hidden>Install update</button>
      </div>
      <p id="tray-error" class="notice" role="alert" hidden></p>
      <section id="setup" hidden>
        <hr />
        <button id="continue-setup" class="row">Finish setup…</button>
      </section>
      <section id="ready-content" hidden>
        <button id="attention" class="row attention" hidden></button>
        <hr />
        <h2 class="section">Last Dictation</h2>
        <div id="recent"></div>
        <hr />
        <label class="row toggle"
          ><span>AI Cleanup</span
          ><input
            id="cleanup"
            type="checkbox"
            role="switch"
            aria-label="AI Cleanup"
        /></label>
        <button id="meeting" class="row">
          <span id="meeting-label">Start Notetaker</span>
        </button>
        <hr />
        <button id="open" class="row">Open Pressay</button>
        <button id="settings" class="row">
          <span>Settings…</span
          ><kbd class="shortcut" id="settings-shortcut">⌘,</kbd>
        </button>
      </section>
      <button id="check-update" class="row">Check for Updates…</button>
      <hr />
      <button id="quit" class="row">
        <span>Quit Pressay</span
        ><kbd class="shortcut" id="quit-shortcut">⌘Q</kbd>
      </button>
    </main>
    <div id="record-menu" class="record-menu" role="menu" hidden>
      <button role="menuitem" data-action="copy">Copy</button
      ><button role="menuitem" data-action="paste">Paste again</button
      ><button role="menuitem" data-action="delete" class="danger">
        Delete
      </button>
    </div>
    <script src="tray.js"></script>
  </body>
</html>
