<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Update control</title><script src="./support.js"></script></head><body><x-dc><helmet><style>*{box-sizing:border-box}.update-control{--u-track:#292b31;--u-fill:#454851;--u-text:#eeeef2;--u-secondary:#bfc1cb;--u-focus:#a6b1ff;width:100%;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}.update-control[data-theme="light"]{--u-track:#dfe0e7;--u-fill:#c3c6d1;--u-text:#252630;--u-secondary:#4f515d;--u-focus:#505dca}.update-capsule{position:relative;display:flex;align-items:center;gap:8px;width:100%;height:36px;padding:0 12px;border:0;border-radius:18px;background:var(--u-track);color:var(--u-text);font:500 12px/16px -apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;cursor:pointer;text-align:left;isolation:isolate;overflow:hidden;white-space:nowrap;-webkit-tap-highlight-color:transparent}.update-capsule:disabled{opacity:1;cursor:default}.update-capsule:not(:disabled):hover{filter:brightness(1.09)}.update-control[data-theme="light"] .update-capsule:not(:disabled):hover{filter:brightness(.97)}.update-capsule:focus-visible{outline:2px solid var(--u-focus);outline-offset:3px}.update-fill{position:absolute;inset:0 auto 0 0;background:var(--u-fill);z-index:-1;transition:width 180ms ease-out;pointer-events:none}.update-symbol{display:block;flex:none;width:14px;height:14px;background:currentColor;mask:var(--u-icon) center/contain no-repeat;-webkit-mask:var(--u-icon) center/contain no-repeat}.update-spinner{display:block;width:13px;height:13px;flex:none;border:1.7px solid currentColor;border-top-color:transparent;border-right-color:transparent;border-radius:50%;animation:update-spin .8s linear infinite}.update-label{flex:1;min-width:0}.update-trailing{font-size:11px;line-height:16px;color:var(--u-secondary);font-variant-numeric:tabular-nums;flex:none}.update-trailing.action{text-decoration:underline;text-underline-offset:2px}.update-hit{padding:4px 0}.update-a11y{position:absolute;clip:rect(0,0,0,0);width:1px;height:1px;overflow:hidden}@keyframes update-spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.update-spinner{animation:none;border-right-color:currentColor}.update-fill{transition:none}}</style></helmet><section id="update-notice" class="update-control" data-theme="{{theme}}" aria-label="App update" style="width:100%"><sc-if value="{{visible}}" hint-placeholder-val="{{true}}"><div class="update-hit"><button id="install-update" class="update-capsule" onClick="{{act}}" disabled="{{working}}" title="{{detail}}" aria-label="{{accessibleLabel}}"><span class="update-fill" style="width:{{fill}}%"></span><sc-if value="{{working}}" hint-placeholder-val="{{false}}"><span class="update-spinner" aria-hidden="true"></span></sc-if><sc-if value="{{still}}" hint-placeholder-val="{{true}}"><span class="update-symbol" aria-hidden="true" style="--u-icon:url({{icon}})"></span></sc-if><span id="update-title" class="update-label">{{label}}</span><sc-if value="{{hasTrailing}}" hint-placeholder-val="{{false}}"><span class="{{trailingClass}}">{{trailing}}</span></sc-if></button><span class="update-a11y" role="status" aria-live="polite">{{label}}</span></div></sc-if></section></x-dc><script type="text/x-dc" data-dc-script data-props='{&quot;theme&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;dark&quot;, &quot;options&quot;: [&quot;dark&quot;, &quot;light&quot;]}, &quot;updateState&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;available&quot;, &quot;options&quot;: [&quot;available&quot;, &quot;checking&quot;, &quot;downloading&quot;, &quot;unknown&quot;, &quot;preparing&quot;, &quot;waiting&quot;, &quot;installing&quot;, &quot;error&quot;, &quot;current&quot;, &quot;idle&quot;]}, &quot;progress&quot;: {&quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 42, &quot;min&quot;: 0, &quot;max&quot;: 100, &quot;step&quot;: 1}, &quot;$preview&quot;: {&quot;width&quot;: 192, &quot;height&quot;: 44}}'>class Component extends DCLogic {
 componentWillUnmount(){clearTimeout(this.updateTimer);}
 start(){clearTimeout(this.updateTimer);this.setState({phase:'downloading',progress:0});let p=0;const step=()=>{p=Math.min(100,p+5);this.setState({progress:p});if(p<100){this.updateTimer=setTimeout(step,180);return;}this.updateTimer=setTimeout(()=>{this.setState({phase:'preparing'});this.updateTimer=setTimeout(()=>{this.setState({phase:'installing'});this.updateTimer=setTimeout(()=>this.setState({phase:'current'}),1100);},1200);},250);};this.updateTimer=setTimeout(step,180);}
 renderVals(){const s=this.state||{};const phase=s.phase??this.props.updateState??'available';const progress=s.progress??this.props.progress??42;const theme=this.props.theme??'dark';const working=['checking','downloading','unknown','preparing','installing'].includes(phase);const labels={available:'Update and restart',checking:'Checking…',downloading:'Downloading…',unknown:'Downloading…',preparing:'Preparing…',waiting:'After recording',installing:'Restarting…',error:'Update failed',current:'Up to date',idle:''};const detail={available:'Pressay 1.13.0 is available. Download, install, and restart.',checking:'Checking for updates…',downloading:'Downloading Pressay 1.13.0. You can keep using the app.',unknown:'Downloading Pressay 1.13.0. Download size is unavailable.',preparing:'Verifying and preparing the update. Pressay will restart automatically.',waiting:'Pressay will update and restart after recording and processing finish. Click to cancel.',installing:'Restarting Pressay to finish the update…',error:'The connection was interrupted. Click to retry.',current:'You’re using the latest version. Click to dismiss.',idle:''};const trailing=phase==='downloading'?Math.round(progress)+'%':phase==='waiting'?'Cancel':phase==='error'?'Retry':phase==='current'?'Done':'';return {theme,working,still:!working,visible:phase!=='idle',label:labels[phase],detail:detail[phase],accessibleLabel:labels[phase]+(trailing?', '+trailing:'')+'. '+detail[phase],trailing,hasTrailing:!!trailing,trailingClass:'update-trailing'+(['waiting','error','current'].includes(phase)?' action':''),fill:phase==='downloading'?progress:['preparing','installing'].includes(phase)?100:0,icon:'icons/'+(phase==='error'?'exclamationmark.triangle':phase==='current'?'checkmark.circle':phase==='waiting'?'clock':'arrow.down.circle')+'.png',act:()=>{if(phase==='waiting'){this.setState({phase:'available'});return;}if(phase==='current'){this.setState({phase:'idle'});return;}if(phase==='error'){this.setState({phase:'checking'});this.updateTimer=setTimeout(()=>this.start(),600);return;}if(phase==='available')this.start();}};
 }
}</script></body></html>
