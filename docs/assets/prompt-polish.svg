<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Prompt polish makes an easily missed constraint explicit</title>
  <desc id="desc">An excerpt of natural dictation asking for a pull request but saying deployment should be left to the speaker becomes a structured instruction that explicitly says not to deploy or merge. A second example shows that the fragment SwiftData remains unchanged.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="#a09b91"/>
    </marker>
    <style>
      .title{font:600 28px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#1c1c1a}
      .body{font:450 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#2b2b28}
      .label{font:650 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:1.5px;fill:#77736a}
      .small{font:450 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#706c64}
      .strong{font:600 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#1c1c1a}
      .mono{font:550 17px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#1c1c1a}
    </style>
  </defs>
  <rect width="1200" height="680" rx="26" fill="#f6f3ec"/>

  <rect x="48" y="38" width="162" height="28" rx="14" fill="#f7e3dd"/>
  <circle cx="66" cy="52" r="4" fill="#cf6b4c"/>
  <text x="78" y="56" class="label" fill="#a84e35">PROMPT POLISH</text>
  <text x="48" y="108" class="title">Your thought process in. A clean agent brief out.</text>
  <text x="1152" y="104" text-anchor="end" class="small">Real calibration example · excerpted for clarity</text>

  <g transform="translate(48 146)">
    <rect width="466" height="342" rx="20" fill="#fffefa" stroke="#dedad0" stroke-width="1.5"/>
    <text x="26" y="40" class="label">YOU SAID</text>
    <text x="26" y="91" class="body">
      <tspan x="26" dy="0">“…open a pull request with the changes</tspan>
      <tspan x="26" dy="31">so we can just approve it or merge it, and</tspan>
      <tspan x="26" dy="31">then it’s gonna deploy—leave that step</tspan>
      <tspan x="26" dy="31">to me. You just do the pull request.”</tspan>
    </text>
    <line x1="26" y1="248" x2="440" y2="248" stroke="#e4e0d7"/>
    <circle cx="39" cy="285" r="5" fill="#cf6b4c"/>
    <text x="56" y="291" class="small">The boundary is easy to miss in a ramble.</text>
  </g>

  <path d="M528 317H660" fill="none" stroke="#a09b91" stroke-width="1.7" marker-end="url(#arrow)"/>
  <rect x="547" y="270" width="94" height="34" rx="17" fill="#f7e3dd"/>
  <text x="594" y="292" text-anchor="middle" class="label" fill="#a84e35">RIGHT ⌘</text>
  <text x="594" y="345" text-anchor="middle" class="small">cleaned text</text>
  <text x="594" y="366" text-anchor="middle" class="small">only</text>

  <g transform="translate(680 146)">
    <rect width="472" height="342" rx="20" fill="#fffefa" stroke="#dedad0" stroke-width="1.5"/>
    <text x="26" y="40" class="label">IT TYPED</text>
    <text x="26" y="90" class="strong">Add the new blog posts to the FR website.</text>
    <circle cx="34" cy="134" r="3.5" fill="#6d5ce7"/>
    <text x="50" y="140" class="body">Follow the existing code patterns.</text>
    <circle cx="34" cy="174" r="3.5" fill="#6d5ce7"/>
    <text x="50" y="180" class="body">Make the posts well written and SEO optimal.</text>
    <circle cx="34" cy="214" r="3.5" fill="#6d5ce7"/>
    <text x="50" y="220" class="body">Open a pull request with the changes.</text>
    <rect x="24" y="252" width="424" height="62" rx="13" fill="#f7e3dd"/>
    <text x="42" y="279" class="strong">Do not deploy or merge the pull request—</text>
    <text x="42" y="302" class="body">leave the deployment step to me.</text>
  </g>

  <rect x="48" y="532" width="1104" height="104" rx="18" fill="#fffefa" stroke="#dedad0" stroke-width="1.5"/>
  <text x="72" y="568" class="label">THE SAFETY NET</text>
  <text x="72" y="607" class="body">When there is no request to structure, prompt polish leaves the fragment alone.</text>
  <rect x="725" y="556" width="150" height="50" rx="14" fill="#f1efe9"/>
  <text x="800" y="587" text-anchor="middle" class="mono">SwiftData</text>
  <path d="M894 581H954" fill="none" stroke="#a09b91" stroke-width="1.7" marker-end="url(#arrow)"/>
  <rect x="973" y="556" width="155" height="50" rx="14" fill="#eeeaff"/>
  <text x="1050" y="587" text-anchor="middle" class="mono">SwiftData</text>
</svg>
