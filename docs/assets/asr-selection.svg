<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">One recommended model for each job</title><desc id="desc">Five local choices · only the active model stays resident</desc><style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;font-variant-numeric:tabular-nums}</style><rect width="1200" height="600" rx="24" fill="#f9f7f3"/><text x="40" y="56" font-size="30" fill="#26242b" font-weight="650" text-anchor="start">One recommended model for each job</text><text x="40" y="90" font-size="16" fill="#6d6875" font-weight="400" text-anchor="start">Five local choices · only the active model stays resident</text><text x="40" y="150" font-size="14" fill="#6d6875" font-weight="650" text-anchor="start">EVERYDAY DICTATION</text><text x="630" y="150" font-size="14" fill="#6d6875" font-weight="650" text-anchor="start">MEETING ACCURACY</text><text x="40" y="200" font-size="19" fill="#6d6875" font-weight="400" text-anchor="start">1.</text><text x="80" y="200" font-size="23" fill="#26242b" font-weight="650" text-anchor="start">Orukeet</text><text x="340" y="200" font-size="15" fill="#8060c4" font-weight="600" text-anchor="start">Recommended</text><text x="40" y="257" font-size="19" fill="#6d6875" font-weight="400" text-anchor="start">2.</text><text x="80" y="257" font-size="23" fill="#26242b" font-weight="400" text-anchor="start">MOSS</text><text x="40" y="314" font-size="19" fill="#6d6875" font-weight="400" text-anchor="start">3.</text><text x="80" y="314" font-size="23" fill="#26242b" font-weight="400" text-anchor="start">Parakeet Ultra</text><text x="40" y="371" font-size="19" fill="#6d6875" font-weight="400" text-anchor="start">4.</text><text x="80" y="371" font-size="23" fill="#26242b" font-weight="400" text-anchor="start">Qwen3-ASR 1.7B</text><text x="40" y="428" font-size="19" fill="#6d6875" font-weight="400" text-anchor="start">5.</text><text x="80" y="428" font-size="23" fill="#26242b" font-weight="400" text-anchor="start">Mega-ASR</text><text x="630" y="200" font-size="19" fill="#6d6875" font-weight="400" text-anchor="start">1.</text><text x="670" y="200" font-size="23" fill="#26242b" font-weight="650" text-anchor="start">MOSS</text><text x="930" y="200" font-size="15" fill="#32917d" font-weight="600" text-anchor="start">Recommended</text><text x="630" y="257" font-size="19" fill="#6d6875" font-weight="400" text-anchor="start">2.</text><text x="670" y="257" font-size="23" fill="#26242b" font-weight="400" text-anchor="start">Orukeet</text><text x="630" y="314" font-size="19" fill="#6d6875" font-weight="400" text-anchor="start">3.</text><text x="670" y="314" font-size="23" fill="#26242b" font-weight="400" text-anchor="start">Parakeet Ultra</text><text x="630" y="371" font-size="19" fill="#6d6875" font-weight="400" text-anchor="start">4.</text><text x="670" y="371" font-size="23" fill="#26242b" font-weight="400" text-anchor="start">Qwen3-ASR 1.7B</text><text x="630" y="428" font-size="19" fill="#6d6875" font-weight="400" text-anchor="start">5.</text><text x="670" y="428" font-size="23" fill="#26242b" font-weight="400" text-anchor="start">Mega-ASR</text><text x="40" y="535" font-size="16" fill="#6d6875" font-weight="400" text-anchor="start">Task-specific recommendation order—not a universal accuracy ranking.</text><text x="40" y="565" font-size="14" fill="#6d6875" font-weight="400" text-anchor="start">Private transcript reviews found no verified dictation winner. Meeting recommendations use human references.</text></svg>