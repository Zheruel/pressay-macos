<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">How Pressay 1.4 chose its transcription models</title>
  <desc id="desc">Thirteen engines were replayed through the same 184-clip corpus and scored on technical-term accuracy. Fun-ASR MLT Nano led at 86 percent, ahead of Voxtral Mini at 81 and Whisper V3 Turbo at 75. Below 60 percent the field clusters regardless of size, and three engines were disqualified for losing dictations or emitting no capitals.</desc>
  <defs>
    <style>
      .h{font:600 27px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#1c1c1a}
      .sub{font:450 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#6d6a63}
      .label{font:550 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#272725}
      .dim{font:450 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#89857d}
      .value{font:600 14px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#1c1c1a}
      .tick{font:450 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#89857d}
      .grid{stroke:#dfdbd2;stroke-width:1}
      .group{font:650 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:1.5px;fill:#77736a}
      .note{font:450 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#77736a}
      .ship{font:650 11px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.8px;fill:#fffefa}
    </style>
  </defs>
  <rect width="1200" height="700" rx="26" fill="#f6f3ec"/>
  <text x="52" y="61" class="h">How the models were chosen</text>
  <text x="52" y="89" class="sub">13 engines · one 184-clip corpus of real dictations · scored on the terms that break an agent prompt</text>

  <text x="52" y="132" class="group">CORRECTLY TRANSCRIBED TECHNICAL TERMS — Kimi · Claude · Codex · Anthropic · RunPod · SonarCloud · macOS · GitHub</text>

  <line x1="392" y1="146" x2="392" y2="600" class="grid"/>
  <line x1="578" y1="146" x2="578" y2="600" class="grid"/>
  <line x1="764" y1="146" x2="764" y2="600" class="grid"/>
  <line x1="950" y1="146" x2="950" y2="600" class="grid"/>
  <line x1="1136" y1="146" x2="1136" y2="600" class="grid"/>
  <text x="392" y="624" text-anchor="middle" class="tick">0%</text>
  <text x="578" y="624" text-anchor="middle" class="tick">25%</text>
  <text x="764" y="624" text-anchor="middle" class="tick">50%</text>
  <text x="950" y="624" text-anchor="middle" class="tick">75%</text>
  <text x="1136" y="624" text-anchor="middle" class="tick">100%</text>

  <text x="370" y="176" text-anchor="end" class="label">Fun-ASR MLT Nano</text>
  <rect x="392" y="158" width="640" height="25" rx="6" fill="#6d5ce7"/>
  <text x="404" y="176" class="ship">SHIPS · DEFAULT</text>
  <text x="1044" y="176" class="value">86%</text>

  <text x="370" y="210" text-anchor="end" class="label">Voxtral Mini 3B</text>
  <rect x="392" y="192" width="603" height="25" rx="6" fill="#5949c7"/>
  <text x="404" y="210" class="ship">SHIPS</text>
  <text x="1007" y="210" class="value">81%</text>

  <text x="370" y="244" text-anchor="end" class="label">Whisper V3 Turbo</text>
  <rect x="392" y="226" width="558" height="25" rx="6" fill="#5949c7"/>
  <text x="404" y="244" class="ship">SHIPS · 100 LANGUAGES</text>
  <text x="962" y="244" class="value">75%</text>

  <text x="370" y="278" text-anchor="end" class="dim">Whisper V3 Large</text>
  <rect x="392" y="260" width="543" height="25" rx="6" fill="#c9c3b6"/>
  <text x="947" y="278" class="value">73%</text>

  <text x="370" y="312" text-anchor="end" class="dim">Fun-ASR Nano</text>
  <rect x="392" y="294" width="446" height="25" rx="6" fill="#c9c3b6"/>
  <text x="850" y="312" class="value">60%</text>

  <text x="370" y="346" text-anchor="end" class="dim">Voxtral Realtime 4B</text>
  <rect x="392" y="328" width="431" height="25" rx="6" fill="#c9c3b6"/>
  <text x="835" y="346" class="value">58%</text>

  <text x="370" y="380" text-anchor="end" class="dim">Qwen3-ASR 1.7B</text>
  <rect x="392" y="362" width="424" height="25" rx="6" fill="#c9c3b6"/>
  <text x="828" y="380" class="value">57%</text>

  <text x="370" y="414" text-anchor="end" class="dim">Granite Speech 4.1 2B</text>
  <rect x="392" y="396" width="424" height="25" rx="6" fill="#c9c3b6"/>
  <text x="828" y="414" class="value">57%</text>

  <text x="370" y="448" text-anchor="end" class="dim">Parakeet TDT 0.6B v3</text>
  <rect x="392" y="430" width="416" height="25" rx="6" fill="#c9c3b6"/>
  <text x="820" y="448" class="value">56%</text>

  <text x="370" y="482" text-anchor="end" class="dim">Canary 1B Flash</text>
  <rect x="392" y="464" width="402" height="25" rx="6" fill="#d8b48f"/>
  <text x="806" y="482" class="value">54%</text>

  <text x="370" y="516" text-anchor="end" class="dim">Canary Qwen 2.5B</text>
  <rect x="392" y="498" width="394" height="25" rx="6" fill="#c9c3b6"/>
  <text x="798" y="516" class="value">53%</text>

  <text x="370" y="550" text-anchor="end" class="dim">Granite Speech 4.1 NAR</text>
  <rect x="392" y="532" width="283" height="25" rx="6" fill="#d8b48f"/>
  <text x="687" y="550" class="value">38%</text>

  <text x="370" y="584" text-anchor="end" class="dim">Parakeet Unified EN</text>
  <rect x="392" y="566" width="268" height="25" rx="6" fill="#d8b48f"/>
  <text x="672" y="584" class="value">36%</text>

  <line x1="52" y1="648" x2="1148" y2="648" class="grid"/>
  <text x="52" y="674" class="note">Shaded bars lost real dictations or emitted no capitals. Below 60% the field clusters regardless of size — a 2.8 GB model is no safer with your product names than a 691 MB one.</text>
</svg>
