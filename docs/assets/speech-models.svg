.h1{font-size:30px;font-weight:700} .h2{font-size:17px;font-weight:600} .b{font-size:15px;font-weight:500} .s{font-size:13px;font-weight:500} .xs{font-size:11.5px;font-weight:600;letter-spacing:.6px}
.num{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
