<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="602" viewBox="0 0 1200 602" role="img" aria-labelledby="title desc">
<title id="title">On-device transcription, cloud-level accuracy</title><desc id="desc">Wispr Flow cloud 9.05, Qwen3-ASR 1.7B 9.00, Voxtral Mini 8.91, Whisper V3 Turbo 8.77, Qwen3-ASR 0.6B 7.32, Fun-ASR 6.95.</desc>
<defs><style>
.bg{fill:#f5f5f7} .card{fill:#ffffff;stroke:#e3e3e8;stroke-width:1} .t1{fill:#1d1d1f} .t2{fill:#6e6e73} .t3{fill:#8e8e93}
