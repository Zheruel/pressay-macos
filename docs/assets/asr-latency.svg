<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">ASR latency on two shared recordings</title>
  <desc id="desc">Whisper V3 Turbo and Voxtral Mini 3B through transcribe.cpp are compared on 6.09 and 35.89 second recordings. Lower is better; Whisper is faster, Voxtral trades speed for long-form quality.</desc>
  <defs>
    <style>
      .h{font:600 27px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#1c1c1a}
      .sub{font:450 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#6d6a63}
      .label{font:550 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#272725}
      .value{font:600 15px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#1c1c1a}
      .tick{font:450 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#89857d}
      .grid{stroke:#dfdbd2;stroke-width:1}
      .group{font:650 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:1.5px;fill:#77736a}
    </style>
  </defs>
  <rect width="1200" height="500" rx="26" fill="#f6f3ec"/>
  <text x="52" y="61" class="h">Release-to-transcript engine time</text>
  <text x="52" y="89" class="sub">Same recordings · warm models · M5 Pro · lower is better</text>

  <line x1="352" y1="112" x2="352" y2="410" class="grid"/>
  <line x1="548" y1="112" x2="548" y2="410" class="grid"/>
  <line x1="744" y1="112" x2="744" y2="410" class="grid"/>
  <line x1="940" y1="112" x2="940" y2="410" class="grid"/>
  <line x1="1136" y1="112" x2="1136" y2="410" class="grid"/>
  <text x="352" y="437" text-anchor="middle" class="tick">0.0 s</text>
  <text x="548" y="437" text-anchor="middle" class="tick">0.6 s</text>
  <text x="744" y="437" text-anchor="middle" class="tick">1.2 s</text>
  <text x="940" y="437" text-anchor="middle" class="tick">1.8 s</text>
  <text x="1136" y="437" text-anchor="middle" class="tick">2.4 s</text>

  <text x="52" y="140" class="group">6.09-SECOND RECORDING</text>
  <text x="330" y="182" text-anchor="end" class="label">Whisper · transcribe.cpp</text>
  <rect x="352" y="162" width="135" height="28" rx="6" fill="#6d5ce7"/>
  <text x="499" y="181" class="value">0.41 s</text>
  <text x="330" y="228" text-anchor="end" class="label">Voxtral Mini 3B</text>
  <rect x="352" y="208" width="246" height="28" rx="6" fill="#c9772f"/>
  <text x="610" y="227" class="value">0.75 s</text>

  <line x1="52" y1="262" x2="1148" y2="262" class="grid"/>
  <text x="52" y="298" class="group">35.89-SECOND RECORDING</text>
  <text x="330" y="340" text-anchor="end" class="label">Whisper · transcribe.cpp</text>
  <rect x="352" y="320" width="295" height="28" rx="6" fill="#6d5ce7"/>
  <text x="659" y="339" class="value">0.90 s</text>
  <text x="330" y="386" text-anchor="end" class="label">Voxtral Mini 3B</text>
  <rect x="352" y="366" width="787" height="28" rx="6" fill="#c9772f"/>
  <text x="1131" y="385" text-anchor="end" class="value" fill="#fffefa">2.41 s</text>
</svg>
