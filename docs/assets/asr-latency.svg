<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">Orukeet leaves more time for cleanup</title><desc id="desc">Median ASR processing cost on Apple M5 Pro · lower is faster</desc><style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;font-variant-numeric:tabular-nums}</style><rect width="1200" height="600" rx="24" fill="#f9f7f3"/><text x="40" y="56" font-size="30" fill="#26242b" font-weight="650" text-anchor="start">Orukeet leaves more time for cleanup</text><text x="40" y="90" font-size="16" fill="#6d6875" font-weight="400" text-anchor="start">Median ASR processing cost on Apple M5 Pro · lower is faster</text><text x="40" y="160" font-size="18" fill="#26242b" font-weight="400" text-anchor="start">Orukeet</text><rect x="240" y="141" width="66.86" height="26" rx="7" fill="#8060c4"/><text x="1100" y="160" font-size="18" fill="#26242b" font-weight="600" text-anchor="end">0.08 s</text><text x="40" y="224" font-size="18" fill="#26242b" font-weight="400" text-anchor="start">Parakeet Ultra</text><rect x="240" y="205" width="119.96" height="26" rx="7" fill="#5c8096"/><text x="1100" y="224" font-size="18" fill="#26242b" font-weight="600" text-anchor="end">0.14 s</text><text x="40" y="288" font-size="18" fill="#26242b" font-weight="400" text-anchor="start">Qwen3-ASR 1.7B</text><rect x="240" y="269" width="548.79" height="26" rx="7" fill="#898a98"/><text x="1100" y="288" font-size="18" fill="#26242b" font-weight="600" text-anchor="end">0.66 s</text><text x="40" y="352" font-size="18" fill="#26242b" font-weight="400" text-anchor="start">MOSS</text><rect x="240" y="333" width="667.25" height="26" rx="7" fill="#32917d"/><text x="1100" y="352" font-size="18" fill="#26242b" font-weight="600" text-anchor="end">0.80 s</text><text x="40" y="416" font-size="18" fill="#26242b" font-weight="400" text-anchor="start">Mega-ASR</text><rect x="240" y="397" width="699.92" height="26" rx="7" fill="#a198ae"/><text x="1100" y="416" font-size="18" fill="#26242b" font-weight="600" text-anchor="end">0.84 s</text><text x="40" y="520" font-size="16" fill="#6d6875" font-weight="400" text-anchor="start">Approximate resident-model ASR cost across 60 recordings; excludes cleanup and model loading.</text><text x="40" y="550" font-size="15" fill="#6d6875" font-weight="400" text-anchor="start">Timing methods differ across runtimes. These are not predicted key-release-to-insert delays.</text></svg>