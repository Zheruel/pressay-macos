<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">What decided the Pressay 1.4 default</title>
  <desc id="desc">The three shipping engines replayed through the same 184-clip corpus. Fun-ASR MLT Nano and Qwen3-ASR 1.7B never collapsed a long dictation; Whisper V3 Turbo collapsed 3 of 47. Fun-ASR is also the fastest at a 0.14 second median against Whisper's 0.39 and Qwen3's 0.44.</desc>
  <defs>
    <style>
      .h{font:600 27px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#1c1c1a}
      .sub{font:450 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#6d6a63}
      .label{font:550 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#272725}
      .value{font:600 15px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#1c1c1a}
      .tick{font:450 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#89857d}
      .grid{stroke:#dfdbd2;stroke-width:1}
      .group{font:650 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:1.5px;fill:#77736a}
    </style>
  </defs>
  <rect width="1200" height="620" rx="26" fill="#f6f3ec"/>
  <text x="52" y="61" class="h">What decided the 1.4 default</text>
  <text x="52" y="89" class="sub">184 real dictations · same corpus, same runtime · M5 Pro · lower is better</text>

  <text x="52" y="140" class="group">LONG DICTATIONS THAT LOST ALL PUNCTUATION AND CAPITALS</text>
  <line x1="352" y1="152" x2="352" y2="290" class="grid"/>
  <line x1="548" y1="152" x2="548" y2="290" class="grid"/>
  <line x1="744" y1="152" x2="744" y2="290" class="grid"/>
  <line x1="940" y1="152" x2="940" y2="290" class="grid"/>
  <line x1="1136" y1="152" x2="1136" y2="290" class="grid"/>
  <text x="352" y="312" text-anchor="middle" class="tick">0</text>
  <text x="548" y="312" text-anchor="middle" class="tick">1</text>
  <text x="744" y="312" text-anchor="middle" class="tick">2</text>
  <text x="940" y="312" text-anchor="middle" class="tick">3</text>
  <text x="1136" y="312" text-anchor="middle" class="tick">4</text>

  <text x="330" y="183" text-anchor="end" class="label">Fun-ASR MLT Nano · default</text>
  <rect x="352" y="164" width="4" height="28" rx="2" fill="#6d5ce7"/>
  <text x="368" y="183" class="value">none of 47</text>

  <text x="330" y="227" text-anchor="end" class="label">Whisper V3 Turbo</text>
  <rect x="352" y="208" width="588" height="28" rx="6" fill="#c9772f"/>
  <text x="952" y="227" class="value">3 of 47</text>

  <text x="330" y="271" text-anchor="end" class="label">Qwen3-ASR 1.7B</text>
  <rect x="352" y="252" width="4" height="28" rx="2" fill="#5949c7"/>
  <text x="368" y="271" class="value">none of 47</text>

  <line x1="52" y1="340" x2="1148" y2="340" class="grid"/>

  <text x="52" y="378" class="group">MEDIAN ENGINE TIME</text>
  <line x1="352" y1="390" x2="352" y2="528" class="grid"/>
  <line x1="509" y1="390" x2="509" y2="528" class="grid"/>
  <line x1="666" y1="390" x2="666" y2="528" class="grid"/>
  <line x1="822" y1="390" x2="822" y2="528" class="grid"/>
  <line x1="979" y1="390" x2="979" y2="528" class="grid"/>
  <line x1="1136" y1="390" x2="1136" y2="528" class="grid"/>
  <text x="352" y="550" text-anchor="middle" class="tick">0.0 s</text>
  <text x="509" y="550" text-anchor="middle" class="tick">0.1 s</text>
  <text x="666" y="550" text-anchor="middle" class="tick">0.2 s</text>
  <text x="822" y="550" text-anchor="middle" class="tick">0.3 s</text>
  <text x="979" y="550" text-anchor="middle" class="tick">0.4 s</text>
  <text x="1136" y="550" text-anchor="middle" class="tick">0.5 s</text>

  <text x="330" y="421" text-anchor="end" class="label">Fun-ASR MLT Nano · default</text>
  <rect x="352" y="402" width="220" height="28" rx="6" fill="#6d5ce7"/>
  <text x="584" y="421" class="value">0.14 s</text>

  <text x="330" y="465" text-anchor="end" class="label">Whisper V3 Turbo</text>
  <rect x="352" y="446" width="612" height="28" rx="6" fill="#c9772f"/>
  <text x="976" y="465" class="value">0.39 s</text>

  <text x="330" y="509" text-anchor="end" class="label">Qwen3-ASR 1.7B</text>
  <rect x="352" y="490" width="690" height="28" rx="6" fill="#5949c7"/>
  <text x="1054" y="509" class="value">0.44 s</text>
</svg>
