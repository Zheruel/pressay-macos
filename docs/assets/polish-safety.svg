<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" viewBox="0 0 1200 550" role="img" aria-labelledby="title desc">
  <title id="title">Protected-token validator pass rate for on-device LLM cleanup variants</title>
  <desc id="desc">Across 31 clips, light plus few-shot passed 93.5 percent, light passed 87.1 percent, the shipping experiment passed 67.7 percent, and light plain instructions passed 25.8 percent.</desc>
  <defs>
    <style>
      .h{font:600 27px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#1c1c1a}
      .sub{font:450 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#6d6a63}
      .label{font:550 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#272725}
      .value{font:600 15px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#1c1c1a}
      .tick{font:450 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#89857d}
      .grid{stroke:#dfdbd2;stroke-width:1}
    </style>
  </defs>
  <rect width="1200" height="550" rx="26" fill="#f6f3ec"/>
  <text x="52" y="61" class="h">Did the LLM preserve every protected token?</text>
  <text x="52" y="89" class="sub">31 real dictations · identifiers, numbers, URLs, names, and negations</text>

  <line x1="330" y1="126" x2="330" y2="444" class="grid"/>
  <line x1="531" y1="126" x2="531" y2="444" class="grid"/>
  <line x1="732" y1="126" x2="732" y2="444" class="grid"/>
  <line x1="933" y1="126" x2="933" y2="444" class="grid"/>
  <line x1="1134" y1="126" x2="1134" y2="444" stroke="#918d84" stroke-width="1.5" stroke-dasharray="5 6"/>
  <text x="330" y="474" text-anchor="middle" class="tick">0%</text>
  <text x="531" y="474" text-anchor="middle" class="tick">25%</text>
  <text x="732" y="474" text-anchor="middle" class="tick">50%</text>
  <text x="933" y="474" text-anchor="middle" class="tick">75%</text>
  <text x="1134" y="474" text-anchor="middle" class="tick">100%</text>

  <text x="306" y="166" text-anchor="end" class="label">Light + few-shot</text>
  <rect x="330" y="146" width="752" height="30" rx="6" fill="#6d5ce7"/>
  <text x="1094" y="165" class="value">93.5%</text>
  <text x="306" y="235" text-anchor="end" class="label">Light</text>
  <rect x="330" y="215" width="700" height="30" rx="6" fill="#7e70df"/>
  <text x="1042" y="234" class="value">87.1%</text>
  <text x="306" y="304" text-anchor="end" class="label">Shipping experiment</text>
  <rect x="330" y="284" width="544" height="30" rx="6" fill="#9388d6"/>
  <text x="886" y="303" class="value">67.7%</text>
  <text x="306" y="373" text-anchor="end" class="label">Light · plain</text>
  <rect x="330" y="353" width="207" height="30" rx="6" fill="#aaa69d"/>
  <text x="549" y="372" class="value">25.8%</text>

  <circle cx="58" cy="512" r="5" fill="#cf6b4c"/>
  <text x="75" y="517" class="sub">No generative variant reached the 100% safety bar required for automatic cleanup.</text>
</svg>
